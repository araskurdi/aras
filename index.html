  checkReviewAnswer() {
    if (ST.reviewSelected == null) return;
    const q = ST.reviewQuestions[ST.reviewQIdx];
    ST.reviewChecked = true;
    const delta = ST.reviewSelected === q.correct ? -1 : 1;
    ST.reviewUpdates[q.wKey] = (ST.reviewUpdates[q.wKey] || 0) + delta;
    const rCorrect = ST.reviewSelected === q.correct;
    if (rCorrect) { ST.reviewCorrectCount += 1; playChime("correct"); }
    else playChime("wrong");
    if (q.wKey && ST.srs[q.wKey]) srsSchedule(q.wKey, ST.srs[q.wKey], rCorrect);
    render();
  },
  continueReview() {
    if (ST.reviewQIdx + 1 >= ST.reviewQuestions.length) {
      Object.entries(ST.reviewUpdates).forEach(([wKey, delta]) => {
        if (!ST.mistakeWords[wKey]) return;
        const newCount = ST.mistakeWords[wKey].count + delta;
        if (newCount <= 0) delete ST.mistakeWords[wKey];
        else ST.mistakeWords[wKey] = { ...ST.mistakeWords[wKey], count: newCount };
      });
      ST.screen = "home";
      render();
    } else {
      ST.reviewQIdx += 1;
      ST.reviewSelected = null;
      ST.reviewChecked = false;
      render();
    }
  },
  exitReview() { ST.screen = "home"; render(); },
  speakReviewPrompt() {
    const q = ST.reviewQuestions[ST.reviewQIdx];
    if (!q) return;
    speak(q.prompt, ST.dialect, ST.voiceURI, ST.speechRate, ST.speechPitch, ST.rawKurdish, ST.kurdishEngine);
  },

  // results
  finishResults() {
    if (ST.resFlying) return;
    ST.resFlying = true;
    render();
    setTimeout(() => { ST.screen = "home"; ST.resFlying = false; render(); }, 1500);
  },

  speakWord(text, langId) { speak(text, langId, ST.voiceURI, ST.speechRate, ST.speechPitch, ST.rawKurdish, ST.kurdishEngine); },
  speakPrompt() {
    const q = ST.lsQuestions[ST.lsQIdx];
    if (!q) return;
    const promptLangId = q.direction === "ku-base" ? ST.dialect : ST.baseLang;
    speak(q.prompt, promptLangId, ST.voiceURI, ST.speechRate, ST.speechPitch, ST.rawKurdish, ST.kurdishEngine);
  },
  speakWordOfDay() {
    const wotd = getWordOfDay(ST.dialect, ST.baseLang);
    speak(wotd.ku, ST.dialect, ST.voiceURI, ST.speechRate, ST.speechPitch, ST.rawKurdish, ST.kurdishEngine);
  },
};

/* ---------------------------------------------------------
   KALICI KAYIT (localStorage) — tarayıcı kapatılsa da ilerleme kaybolmaz
--------------------------------------------------------- */
const STORAGE_KEY = "kurdi-progress-v1";

function saveProgress() {
  try {
    const payload = {
      onboarded: ST.screen !== "onboarding",
      progress: Array.from(ST.progress),
      xp: ST.xp, streak: ST.streak, baseLang: ST.baseLang, dialect: ST.dialect,
      lessonsCompleted: ST.lessonsCompleted, perfectCount: ST.perfectCount,
      profileName: ST.profileName, profileColor: ST.profileColor,
      voiceURI: ST.voiceURI, speechRate: ST.speechRate, speechPitch: ST.speechPitch, rawKurdish: ST.rawKurdish, kurdishEngine: ST.kurdishEngine,
      username: ST.username, avatarType: ST.avatarType, avatarMascotId: ST.avatarMascotId, avatarPhoto: ST.avatarPhoto,
      lastPracticeDate: ST.lastPracticeDate, streakFreezes: ST.streakFreezes, mistakeWords: ST.mistakeWords,
      darkMode: ST.darkMode, practiceCount: ST.practiceCount, wordMastery: ST.wordMastery,
      totalCorrect: ST.totalCorrect, totalAttempted: ST.totalAttempted, longestStreak: ST.longestStreak,
      dailyHistory: ST.dailyHistory, favoriteWords: ST.favoriteWords, srs: ST.srs,
      dailyGoalXp: ST.dailyGoalXp, dailyXpEarned: ST.dailyXpEarned, dailyGoalDate: ST.dailyGoalDate,
      weekChallengeKey: ST.weekChallengeKey, weekChallengeCount: ST.weekChallengeCount, weekChallengeClaimed: ST.weekChallengeClaimed,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    // localStorage yoksa (gizli sekme vb.) sessizce geç
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.onboarded) return false;
    ST.progress = new Set(d.progress || []);
    ST.xp = d.xp || 0;
    ST.streak = d.streak || 0;
    ST.baseLang = d.baseLang || "tr";
    ST.dialect = d.dialect || "kmr";
    ST.lessonsCompleted = d.lessonsCompleted || 0;
    ST.perfectCount = d.perfectCount || 0;
    ST.profileName = d.profileName || "";
    ST.profileColor = d.profileColor || PROFILE_COLORS[0];
    ST.voiceURI = d.voiceURI || null;
    ST.speechRate = d.speechRate != null ? d.speechRate : 1.0;
    ST.speechPitch = d.speechPitch != null ? d.speechPitch : 1.05;
    ST.rawKurdish = !!d.rawKurdish;
    ST.kurdishEngine = d.kurdishEngine || "tr";
    ST.username = d.username || "";
    ST.avatarType = d.avatarType || "initial";
    ST.avatarMascotId = d.avatarMascotId || "gold";
    ST.avatarPhoto = d.avatarPhoto || null;
    ST.lastPracticeDate = d.lastPracticeDate || null;
    ST.streakFreezes = d.streakFreezes || 0;
    ST.mistakeWords = d.mistakeWords || {};
    ST.darkMode = !!d.darkMode;
    ST.practiceCount = d.practiceCount || {};
    ST.wordMastery = d.wordMastery || {};
    ST.totalCorrect = d.totalCorrect || 0;
    ST.totalAttempted = d.totalAttempted || 0;
    ST.longestStreak = d.longestStreak || 0;
    ST.dailyHistory = d.dailyHistory || {};
    ST.favoriteWords = d.favoriteWords || {};
    ST.srs = d.srs || {};
    ST.dailyGoalXp = d.dailyGoalXp || 20;
    ST.dailyXpEarned = d.dailyXpEarned || 0;
    ST.dailyGoalDate = d.dailyGoalDate || null;
    ST.weekChallengeKey = d.weekChallengeKey || null;
    ST.weekChallengeCount = d.weekChallengeCount || 0;
    ST.weekChallengeClaimed = !!d.weekChallengeClaimed;
    ST.screen = "home";
    return true;
  } catch (e) {
    return false;
  }
}

const _targetScreen = loadProgress() ? ST.screen : "onboarding";
ST.screen = "splash";
render();
setTimeout(() => {
  ST.screen = _targetScreen;
  render();
}, 3000);
</script>
