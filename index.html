// Konuşma sentezi için en yakın dil kodu (tarayıcı desteğine göre en iyi eşleşme)
const SPEECH_LANG = { tr: "tr-TR", en: "en-US", kmr: "tr-TR", ckb: "tr-TR", zza: "tr-TR" };

// Aynı dil için HER ZAMAN aynı sesi döndürür (rastgele/dalgalı değil)
function pickDefaultVoice(langId) {
  const voices = _voiceCache.length ? _voiceCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  if (!voices.length) return null;
  const target = SPEECH_LANG[langId] || "tr-TR";
  const prefix = target.split("-")[0];
  return voices.find((v) => v.lang === target) || voices.find((v) => v.lang && v.lang.startsWith(prefix)) || null;
}

// Tarayıcı sesleri önceden yüklenmeyebilir; hazır olduklarında önbelleğe al.
let _voiceCache = [];
if (typeof window !== "undefined" && window.speechSynthesis) {
  const loadVoices = () => { _voiceCache = window.speechSynthesis.getVoices(); };
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// Kürtçe harfleri (x, q, w, ê, î, û) Türkçe TTS motorunun daha doğru okuyacağı
// karşılıklarına çevirir. Tarayıcılarda yerleşik Kürtçe ses neredeyse hiç
// bulunmadığından, en yakın telaffuzu Türkçe motor üzerinden yaklaştırıyoruz.
function kurdishPhoneticApprox_TR(text) {
  const map = [
    // "xw" Kürtçe'de çok sık geçer (Xwarin, Xwedê, Xwendekar...). Ayrı ayrı
    // x→h ve w→v uygulanırsa "hv" gibi doğal olmayan bir küme çıkıyordu.
    [/xw/g, "hu"], [/Xw/g, "Hu"], [/XW/g, "HU"],
    [/x/g, "h"], [/X/g, "H"],
    [/q/g, "k"], [/Q/g, "K"],
    [/w/g, "v"], [/W/g, "V"],   // w: Türkçe'de bu harf hiç yok → 'v' en yakını
    [/ê/g, "e"], [/Ê/g, "E"],
    // Kürtçe'de şapkasız "i" kapalı/arka ünlüdür — Türkçe "ı" gibi okunur.
    // Şapkalı "î" ise Türkçe "i" gibidir.
    [/i/g, "ı"],
    [/î/g, "i"], [/Î/g, "İ"],
    [/û/g, "u"], [/Û/g, "U"],
  ];
  return map.reduce((t, [re, rep]) => t.replace(re, rep), text);
}

// FARKLI BİR MOTOR: İngilizce TTS motoruyla yaklaşık okuma. İngilizce'de
// "w" harfi zaten doğal var (Xwarin gibi kelimelerde v'ye çevirmeye gerek
// kalmıyor) — bazı cihazlarda Türkçe tabanlı yaklaşımdan daha net çıkabilir.
function kurdishPhoneticApprox_EN(text) {
  const map = [
    [/x/g, "kh"], [/X/g, "Kh"],
    [/q/g, "k"], [/Q/g, "K"],
    // w BURADA DEĞİŞTİRİLMİYOR — İngilizce'de zaten doğru okunan bir harf
    [/ê/g, "e"], [/Ê/g, "E"],
    [/î/g, "ee"], [/Î/g, "Ee"],
    [/û/g, "oo"], [/Û/g, "Oo"],
    [/ş/g, "sh"], [/Ş/g, "Sh"],
    [/ç/g, "ch"], [/Ç/g, "Ch"],
    [/c/g, "j"], [/C/g, "J"],
    [/j/g, "zh"], [/J/g, "Zh"],
  ];
  return map.reduce((t, [re, rep]) => t.replace(re, rep), text);
}

function kurdishPhoneticApprox(text, engine) {
  return engine === "en" ? kurdishPhoneticApprox_EN(text) : kurdishPhoneticApprox_TR(text);
}

function speak(text, langId, preferredVoiceURI, rateOverride, pitchOverride, useRaw, kurdishEngine) {
  try {
    if (!window.speechSynthesis) return;
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
    }
    window.speechSynthesis.resume();
    const isKurdish = langId === "kmr" || langId === "ckb" || langId === "zza";
    const speakableText = (langId === "ckb" && CKB_SPEECH_MAP[text]) ? CKB_SPEECH_MAP[text] : text;
    const engine = kurdishEngine === "en" ? "en" : "tr";
    const spokenText = (isKurdish && !useRaw) ? kurdishPhoneticApprox(speakableText, engine) : speakableText;
    const effectiveLangId = isKurdish ? engine : langId;
    // Kullanıcı Ayarlar'dan elle bir ses seçtiyse otomatik tahmini atla —
    // hangi sesin net çıktığını en iyi kullanıcı kendi kulağıyla bilir.
    const voices = _voiceCache.length ? _voiceCache : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
    const manualVoice = preferredVoiceURI ? voices.find((v) => v.voiceURI === preferredVoiceURI) : null;
    const voice = manualVoice || pickDefaultVoice(effectiveLangId);
    // NOT: cümle sonuna zorla nokta eklemek bazı seslerde çok abartılı/"korkutucu"
    // bir düşen tonlama yaratıyordu — kaldırıldı. Hızı aşırı düşürmek de sesi
    // gerip boğuklaştırıyor; doğal hıza yakın kalıyoruz.
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(spokenText);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : (SPEECH_LANG[effectiveLangId] || "tr-TR");
      u.rate = rateOverride != null ? rateOverride : 1.0;
      u.pitch = pitchOverride != null ? pitchOverride : 1.05;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }, 30);
  } catch (e) {
    // tarayıcı desteklemiyorsa sessizce geç
  }
}

const _sfxPool = { correct: [], wrong: [], _i: { correct: 0, wrong: 0 } };
let _sfxReady = false;

function initSfx() {
  if (_sfxReady || typeof Audio === "undefined") return;
  try {
    ["correct", "wrong"].forEach(function (k) {
      for (let i = 0; i < 3; i++) {
        const a = new Audio(SFX_SRC[k]);
        a.preload = "auto";
        a.volume = 0.75;
        _sfxPool[k].push(a);
      }
    });
    _sfxReady = true;
  } catch (e) {
    // sessiz geç
  }
}

// İlk kullanıcı etkileşiminde sesleri hazırla (tarayıcı politikası)
function unlockAudio() {
  initSfx();
  if (!_sfxReady) return;
  ["correct", "wrong"].forEach(function (k) {
    const a = _sfxPool[k][0];
    if (a && a.paused && a.currentTime === 0) {
      const prev = a.volume;
      a.volume = 0;
      const p = a.play();
      if (p && p.then) {
        p.then(function () { a.pause(); a.currentTime = 0; a.volume = prev; })
         .catch(function () { a.volume = prev; });
      } else {
        a.volume = prev;
      }
    }
  });
}
if (typeof document !== "undefined" && document.addEventListener) {
  ["pointerdown", "touchstart", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, unlockAudio, { passive: true });
  });
}

function playChime(kind) {
  if (kind !== "correct" && kind !== "wrong") return;
  try {
    initSfx();
    const pool = _sfxPool[kind];
    if (!pool || !pool.length) return;
    const idx = _sfxPool._i[kind] % pool.length;
    _sfxPool._i[kind] = idx + 1;
    const a = pool[idx];
    a.currentTime = 0;
    const p = a.play();
    if (p && p.catch) p.catch(function () {});
  } catch (e) {
    // sessiz geç
  }
}

--------------------------------------------------------- */
let _toneStarted = false;
async function ensureToneStarted() {
  if (typeof Tone === "undefined") return false;
  if (!_toneStarted) {
    try { await Tone.start(); _toneStarted = true; } catch (e) { return false; }
  }
  return true;
}

async function playHalayMusic() {
  try {
    const ok = await ensureToneStarted();
    if (!ok) return;
    const now = Tone.now();
    const dum = new Tone.MembraneSynth({
      pitchDecay: 0.05, octaves: 3.5,
      envelope: { attack: 0.001, decay: 0.32, sustain: 0.001, release: 0.1 },
    }).toDestination();
    dum.volume.value = -5;
    const tek = new Tone.MetalSynth({
      envelope: { attack: 0.001, decay: 0.12, release: 0.03 },
      harmonicity: 4.1, modulationIndex: 14, resonance: 1800, octaves: 0.5,
    }).toDestination();
    tek.volume.value = -22;

    const beatDur = 0.185;
    const pattern = ["dum", "tek", "dum", "tek", "dum", "dum", "tek", "dum"];
    pattern.forEach((hit, i) => {
      const t = now + i * beatDur;
      if (hit === "dum") dum.triggerAttackRelease("C2", "8n", t);
      else tek.triggerAttackRelease("16n", t);
    });

    const zurna = new Tone.Synth({
      oscillator: { type: "sawtooth" },
      envelope: { attack: 0.015, decay: 0.08, sustain: 0.55, release: 0.12 },
    }).toDestination();
    zurna.volume.value = -13;
    const notes = ["D4", "Eb4", "F#4", "G4", "A4", "G4", "F#4", "D4"];
    notes.forEach((n, i) => zurna.triggerAttackRelease(n, "8n", now + i * beatDur));

    setTimeout(() => { dum.dispose(); tek.dispose(); zurna.dispose(); }, 2600);
  } catch (e) {
    // sessiz geç
  }
}

// Geleneksel "zılgıt" — hızlı, titreşimli, tiz bir sevinç sesi (sentezlenmiş, stilize).
async function playZilgit() {
  try {
    const ok = await ensureToneStarted();
    if (!ok) return;
    const now = Tone.now();
    const voice = new Tone.Synth({
      oscillator: { type: "sine" },
      envelope: { attack: 0.005, decay: 0.03, sustain: 0.7, release: 0.05 },
    }).toDestination();
    voice.volume.value = -10;
    const trill = ["A5", "C6", "A5", "C6", "A5", "C6", "A5", "C6", "A5", "C6", "A5", "B5"];
    trill.forEach((p, i) => voice.triggerAttackRelease(p, "32n", now + i * 0.075));
    setTimeout(() => voice.dispose(), 1400);
  } catch (e) {
    // sessiz geç
  }
}

function buildSearchIndex() {
  const rows = [];
  UNITS.forEach((unit) => {
    unit.lessons.forEach((lesson) => {
      lesson.words.forEach((w) => {
        rows.push({ ...w, unitId: unit.id });

    });
  });
  DICTIONARY_EXTRA.forEach((w) => rows.push({ ...w, unitId: "dictionary" }));
  return rows;
}

function levelFromXp(xp) {
  const level = Math.floor(xp / 100) + 1;
  const inLevel = xp % 100;
  return { level, inLevel, toNext: 100 - inLevel };
}

// Tüm kelimelerin düz listesi — "günün kelimesi" için kullanılır
const ALL_WORDS = UNITS.flatMap((u) => u.lessons.flatMap((l) => l.words));

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

// Gerçek takvim tarihine dayalı seri hesaplama
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const WEEK_CHALLENGE_TARGET = 5;
function getWeekKey() {
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - jan1) / 86400000) + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${week}`;
}
function daysBetween(dateStrA, dateStrB) {
  const a = new Date(dateStrA + "T00:00:00");
  const b = new Date(dateStrB + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
function updateStreakOnPractice(lastPracticeDate, streak, streakFreezes) {
  const today = todayStr();
  if (!lastPracticeDate) return { streak: 1, lastPracticeDate: today, streakFreezes };
  const gap = daysBetween(lastPracticeDate, today);
  if (gap === 0) return { streak, lastPracticeDate: today, streakFreezes };
  if (gap === 1) {
    const newStreak = streak + 1;
    const gainedFreeze = newStreak % 7 === 0 && streakFreezes < 2;
    return { streak: newStreak, lastPracticeDate: today, streakFreezes: gainedFreeze ? streakFreezes + 1 : streakFreezes };
  }
  if (streakFreezes > 0) return { streak: streak + 1, lastPracticeDate: today, streakFreezes: streakFreezes - 1 };
  return { streak: 1, lastPracticeDate: today, streakFreezes };
}

/* ---------------------------------------------------------
   ARALIKLI TEKRAR (SRS)
   Her kelime, doğru bilindikçe giderek uzayan aralıklarla
   tekrar karşına çıkar: 1 → 3 → 7 → 16 → 35 → 75 gün.
   Yanlış bilinirse başa döner. Böylece unutmak üzereyken
   tekrar etmiş olursun.
--------------------------------------------------------- */
const SRS_INTERVALS = [1, 3, 7, 16, 35, 75];

function addDaysStr(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Bir kelimeyi cevapladıktan sonra bir sonraki tekrar tarihini planla
function srsSchedule(wKey, wordData, wasCorrect) {
  const today = todayStr();
  const prev = ST.srs[wKey];
  let step;
  if (!wasCorrect) {
    step = 0;
  } else {
    step = Math.min((prev ? prev.step : -1) + 1, SRS_INTERVALS.length - 1);
  }
  ST.srs[wKey] = {
    step,
    due: addDaysStr(today, SRS_INTERVALS[step]),
    ku: wordData.ku,
    base: wordData.base,
    dialect: wordData.dialect,
    baseLang: wordData.baseLang,
  };
}

// Bugün tekrar zamanı gelmiş kelimeler
function srsDueEntries() {
  const today = todayStr();
  return Object.entries(ST.srs)
    .filter(function (e) {
      const v = e[1];
      return v && v.dialect === ST.dialect && v.baseLang === ST.baseLang && v.due <= today;
    })
    .sort(function (a, b) { return a[1].due < b[1].due ? -1 : 1; });
}

// Daha önce yanlış yapılan kelimelerden tekrar sorusu havuzu oluşturur
// Yanlış yapılan kelimeleri tekrar havuzuna ekler — ders başarıyla bitse de
// başarısız olsa da (4 yanlış) çağrılır, böylece o kelimeler kaybolmaz.
function mergeMissedWordsIntoPool(missedWords) {
  (missedWords || []).forEach((w) => {
    const wKey = `${w.dialect}::${w.ku}`;
    const prev = ST.mistakeWords[wKey];
    ST.mistakeWords[wKey] = { ...w, count: (prev?.count || 0) + 1 };
  });
}

function buildReviewQuestions(mistakeWords, dialect, baseLang) {
  const pools = getPools(dialect, baseLang);
  const seen = {};
  const picked = [];
  // 1) Tekrar zamanı gelmiş kelimeler (aralıklı tekrar)
  srsDueEntries().forEach(function (e) {
    if (picked.length >= 15 || seen[e[0]]) return;
    seen[e[0]] = 1;
    picked.push({ wKey: e[0], ku: e[1].ku, base: e[1].base });
  });
  // 2) Yer kaldıysa: en çok yanlış yapılanlar
  Object.entries(mistakeWords)
    .sort(function (a, b) { return b[1].count - a[1].count; })
    .forEach(function (e) {
      if (picked.length >= 15 || seen[e[0]]) return;
      seen[e[0]] = 1;
      picked.push({ wKey: e[0], ku: e[1].ku, base: e[1].base });
    });
  return shuffle(picked.map(function (p) {
    return Object.assign({}, makeQuestion(p.ku, p.base, "ku-base", pools), { wKey: p.wKey });
  }));
}

// Tarihe göre değişen, herkes için o gün aynı olan "günün kelimesi"

  const idx = dayOfYear(new Date()) % ALL_WORDS.length;

// Tüm birimlerdeki kelimelerin havuzu — çeldirici üretmek için
function getPools(dialect, baseLang) {

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Yazarak-çeviri egzersizlerinde Kürtçe özel harfleri (ê,î,û,ş,ç) klavyede
// bulamayan kullanıcıları cezalandırmamak için gevşek karşılaştırma yapıyoruz.
function normalizeForTyping(str) {
  return str
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ")
    .replace(/[êë]/g, "e")
    .replace(/[îı]/g, "i")
    .replace(/[ûü]/g, "u")
    .replace(/ş/g, "s")
    .replace(/ç/g, "c")
    .replace(/[ğ]/g, "g")
    .replace(/[?!.,]/g, "");
}

// Bir ünitenin sırasına göre 0 (en kolay/ilk ünite) ile 1 (en zor/son ünite)
// arası bir zorluk katsayısı — ünite ilerledikçe yazma/kelime bankası gibi
// üretim gerektiren (daha zor) soru türleri daha sık çıkar.
function difficultyFor(unitIdx, totalUnits) {
  if (totalUnits <= 1) return 0;
  return unitIdx / (totalUnits - 1);
}

function makeQuestion(ku, base, direction, pools, difficulty, dialect) {
  difficulty = difficulty || 0;
  const prompt = direction === "ku-base" ? ku : base;
  const correct = direction === "ku-base" ? base : ku;
  const isMultiWord = correct.trim().split(/\s+/).length > 1;

  // Sorani Arapça-temelli alfabeyle yazıldığı için, uygun bir Arapça
  // klavye/IME olmadan "yazma" alıştırması mantıksız olur.
  const canType = dialect !== "ckb";
  let kind = "choice";
  if (direction === "base-ku") {
    const wordbankChance = 0.35 + difficulty * 0.3;
    const typingChance = canType ? 0.22 + difficulty * 0.28 : 0;
    if (isMultiWord && Math.random() < wordbankChance) kind = "wordbank";
    else if (!isMultiWord && canType && Math.random() < typingChance) kind = "typing";
  }

  if (kind === "wordbank") {
    const words = correct.trim().split(/\s+/);
    // Havuzdan çeldirici kelimeler al (doğru cevaptaki kelimeler hariç)
    const pool = direction === "ku-base" ? pools.allBase : pools.allKu;
    const distractors = shuffle(
      pool.filter((w) => !words.includes(w) && w.split(" ").length === 1)
    ).slice(0, Math.max(2, Math.min(4, words.length)));
    const bankWords = shuffle([
      ...words.map((w, i) => ({ word: w, uid: `correct-${i}-${w}`, isCorrect: true })),
      ...distractors.map((w, i) => ({ word: w, uid: `decoy-${i}-${w}`, isCorrect: false })),
    ]);
    return { prompt, correct, direction, kind, bank: bankWords };
  }
  if (kind === "typing") {
    return { prompt, correct, direction, kind };
  }

  const pool = direction === "ku-base" ? pools.allBase : pools.allKu;
  const distractors = shuffle(pool.filter((w) => w !== correct)).slice(0, 3);
  const options = shuffle([correct, ...distractors]);
  // KU->Base sorularının bir kısmı "dinle ve seç" alıştırmasına dönüşür:
  // kelime önce yazı olarak gizli kalır, ses otomatik çalar.
  const listening = direction === "ku-base" && Math.random() < 0.4;
  return { prompt, correct, options, direction, kind, listening };
}

// Bildiğin bir kelime tekrar tekrar sorulmasın: üst üste doğru cevap
// "streak"i eşiği geçince o kelime bu derste sadece TEK yönde sorulur.
const MASTERY_THRESHOLD = 3;
// Bir derste bir seferde en fazla kaç kelime sorulsun — çok kelimeli
// derslerde soru sayısı aşırı uzamasın diye bir üst sınır. En zayıf
// (ustalık seviyesi düşük) kelimeler öncelikli seçilir.
const SESSION_WORD_CAP = 6;

function pickSessionPairs(pairs, wordMastery) {
  wordMastery = wordMastery || {};
  const unmastered = pairs.filter(([ku]) => (wordMastery[ku] || 0) < MASTERY_THRESHOLD);
  const mastered = pairs.filter(([ku]) => (wordMastery[ku] || 0) >= MASTERY_THRESHOLD);

  if (unmastered.length === 0) {
    return shuffle(mastered).slice(0, Math.min(3, mastered.length));
  }
  if (unmastered.length >= SESSION_WORD_CAP) {
    return shuffle(unmastered).slice(0, SESSION_WORD_CAP);
  }
  const fillerCount = Math.min(2, mastered.length);
  const filler = shuffle(mastered).slice(0, fillerCount);
  return shuffle([...unmastered, ...filler]);
}

function buildQuestions(pairs, pools, wordMastery, difficulty, dialect) {
  wordMastery = wordMastery || {};
  difficulty = difficulty || 0;
  const groups = pairs.map(([ku, base], idx) => {
    const streak = wordMastery[ku] || 0;
    const bothDirections = shuffle(["ku-base", "base-ku"]);
    const directions = (streak >= 1 || Math.random() < 0.4) ? [bothDirections[0]] : bothDirections;
    return {
      idx,
      masteryKey: ku,
      remaining: shuffle(directions.map((d) => makeQuestion(ku, base, d, pools, difficulty, dialect))),
    };
  });

  const result = [];
  let lastIdx = -1;
  while (groups.some((g) => g.remaining.length)) {
    let candidates = groups.filter((g) => g.remaining.length && g.idx !== lastIdx);
    if (candidates.length === 0) {
      candidates = groups.filter((g) => g.remaining.length);
    }
    const chosen = candidates[Math.floor(Math.random() * candidates.length)];
    const q = chosen.remaining.shift();
    q.masteryKey = chosen.masteryKey;
    result.push(q);
    lastIdx = chosen.idx;
  }
  // güvenlik ağı: olası bir veri hatasına karşı aynı prompt'u ikinci kez göstermeyi engelle
  const seen = new Set();
  return result.filter((q) => {
    const key = q.direction + "::" + q.prompt;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function shade(hex, percent) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + percent, g = ((n >> 8) & 0xff) + percent, b = (n & 0xff) + percent;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}

function htmlLessonNode(status, label, accent, offset, isNext, onclickAttr, tier) {
  tier = tier || 0;
  const bg = status === "completed" ? accent : status === "available" ? COLORS.gold : COLORS.locked;
  const border = status === "completed" ? `3px solid ${accent}` : "none";
  const glowCol = status === "completed" ? accent : COLORS.gold;
  const boxShadow = status === "locked"
    ? "inset 0 0 0 1px rgba(128,128,128,0.14)"
    : `0 8px 20px -8px ${glowCol}, 0 2px 6px -2px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(255,255,255,0.14)`;
  const cursor = status === "locked" ? "default" : "pointer";
  const pulse = isNext
    ? `<span style="position:absolute;width:62px;height:62px;border-radius:50%;border:2.5px solid ${COLORS.gold};animation:nodePulse 1.8s ease-out infinite;pointer-events:none"></span>`
    : "";
  const tierBadge = (status === "completed" && tier > 0)
    ? `<span style="position:absolute;top:-6px;right:calc(50% - 34px);font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.3))">${tier >= 3 ? "👑" : "⭐"}</span>`
    : "";
  let icon;
  if (status === "completed") {
    icon = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
  } else if (status === "locked") {
    icon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#A79A7E" stroke-width="2" /><path d="M8 11V8a4 4 0 018 0v3" stroke="#A79A7E" stroke-width="2" /></svg>`;
  } else {
    icon = svgSunBadge(26);
  }
  return `<div style="display:flex;justify-content:center;transform:translateX(${offset}px);margin:10px 0;position:relative">
    ${pulse}
    ${tierBadge}
    <button ${status === "locked" ? "disabled" : `onclick="${onclickAttr}"`} title="${tier > 0 ? `${label} (${tier + 1}x)` : label}"
      class="nodeBtn"
      style="width:64px;height:64px;border-radius:50%;border:${border};background:${bg};box-shadow:${boxShadow};cursor:${cursor};display:flex;align-items:center;justify-content:center;position:relative">
      ${icon}
    </button>
  </div>`;
}

function renderSplash() {
  let sparkles = "";
  for (let i = 0; i < 26; i++) {
    const left = Math.random() * 100;
    const top = Math.random() * 100;
    const delay = (2.1 + Math.random() * 0.5).toFixed(2);
    const dur = (0.7 + Math.random() * 0.5).toFixed(2);
    const size = 10 + Math.random() * 16;
    sparkles += `<span style="position:absolute;left:${left}%;top:${top}%;font-size:${size}px;color:${COLORS.gold};opacity:0;animation:splashSparklePop ${dur}s ease-out ${delay}s forwards">✦</span>`;
  }
  return `<div style="position:fixed;inset:0;z-index:2000;background:${COLORS.sand};display:flex;align-items:center;justify-content:center;overflow:hidden;animation:splashFadeOut 3s ease forwards">
    <style>

        100% { opacity: 1; transform: scale(1); }

        0%   { left: -32%; bottom: -28%; transform: rotate(-32deg) scale(0.6); opacity: 0; }
        15%  { opacity: 1; }

        55%  { left: 42%; bottom: 45%; transform: rotate(-28deg) scale(1.4); opacity: 1; }

      @keyframes splashSparklePop {
        0%   { opacity: 0; transform: scale(0.2) rotate(0deg); }
        40%  { opacity: 1; transform: scale(1.2) rotate(25deg); }
        100% { opacity: 0; transform: scale(0.4) rotate(50deg); }
      }
      @keyframes splashFadeOut {
        0%   { opacity: 1; }
        86%  { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }

function render() {
  applyTheme(ST.darkMode);
  // Sayfa dilini kullanıcının seçimiyle eşitle (ekran okuyucular ve
  // arama motorları doğru dili görsün)
  try {
    if (typeof document !== "undefined" && document.documentElement) {
      document.documentElement.lang = ST.baseLang === "en" ? "en" : "tr";
    }
  } catch (e) {}
  const r = root();
  if (ST.screen === "splash") { r.innerHTML = renderSplash(); return; }
  let content = "";
  if (ST.screen === "onboarding") content = renderOnboarding();
  else if (ST.screen === "home") content = renderHome();
  else if (ST.screen === "lesson") content = renderLesson();
  else if (ST.screen === "review") content = renderReview();
  else if (ST.screen === "results") content = renderResults();
  else if (ST.screen === "settings") content = renderSettings();
  else if (ST.screen === "culture") content = renderCulture();
  else if (ST.screen === "dialogues") content = renderDialogues();
  else if (ST.screen === "certificate") content = renderCertificate();
  else if (ST.screen === "flashcards") content = renderFlashcards();
  else if (ST.screen === "grammar") content = renderGrammarTips();
  else if (ST.screen === "verbs") content = renderVerbs();
  else if (ST.screen === "sentences") content = renderSentences();
  else if (ST.screen === "match") content = renderMatch();
  else if (ST.screen === "quickround") content = renderQuickRound();
  else if (ST.screen === "favorites") content = renderFavorites();
  else if (ST.screen === "search") content = renderSearch();
  else if (ST.screen === "stats") content = renderStats();
  r.innerHTML = content + (NAV_SCREENS.includes(ST.screen) ? renderBottomNav() : "");
  r.style.paddingBottom = NAV_SCREENS.includes(ST.screen) ? "74px" : "0";
  if (typeof document !== "undefined" && document.body) document.body.style.background = COLORS.sand;
  r.style.animation = "none";
  void r.offsetWidth;
  r.style.animation = "screenFade .32s ease";
  afterRender();
  if (typeof saveProgress === "function") saveProgress();
}

function afterRender() {
  if (ST.screen === "lesson") {
    const q = ST.lsQuestions[ST.lsQIdx];
    if (q && q.listening && !ST.lsChecked && !ST.lsListeningPlayed) {
      ST.lsListeningPlayed = true;
      const promptLangId = q.direction === "ku-base" ? ST.dialect : ST.baseLang;
      setTimeout(() => speak(q.prompt, promptLangId, ST.voiceURI, ST.speechRate, ST.speechPitch, ST.rawKurdish, ST.kurdishEngine), 350);
    }
  }
  if (ST.screen === "settings" && window.speechSynthesis) {
    const load = () => { ST.stVoiceList = window.speechSynthesis.getVoices(); renderVoiceListOnly(); };
    load();
    window.speechSynthesis.onvoiceschanged = load;
  }
}

  const badgesHtml = BADGES.map((b) => {
    const unlocked = b.test(stats);

  }).join("");

  let nextMarked = false;
  let lastTier = null;
  let pathIdx = 0;
  const pathOffsets = [0, -76, -50, 76, 50];
  const unitCardsHtml = UNITS.map((unit, ui) => {

    const lessonsHtml = unit.lessons.map((lesson, li) => {

      const offset = pathOffsets[pathIdx % pathOffsets.length];

/* ---------------------------------------------------------
   LESSON
--------------------------------------------------------- */
function renderLesson() {
  const unit = UNITS[ST.active.unitIdx];
  const lesson = unit.lessons[ST.active.lessonIdx];
  const accent = UNIT_ACCENTS[ST.active.unitIdx % UNIT_ACCENTS.length];
  const S = STRINGS[ST.baseLang];
  const dialectLabel = DIALECTS.find((d) => d.id === ST.dialect).label;
  const baseLabel = BASE_LANGS.find((b) => b.id === ST.baseLang).label;

  if (ST.lsQuestions.length === 0) {
    const pools = getPools(ST.dialect, ST.baseLang);
    const pairs = pickSessionPairs(lessonPairs(lesson, ST.dialect, ST.baseLang), ST.wordMastery);
    const difficulty = difficultyFor(ST.active.unitIdx, UNITS.length);
    ST.lsQuestions = buildQuestions(pairs, pools, ST.wordMastery, difficulty, ST.dialect);
  }

  const q = ST.lsQuestions[ST.lsQIdx];
  if (q.kind === "wordbank" && ST.lsAvailableChips.length === 0 && ST.lsChipOrder.length === 0 && !ST.lsChecked) {
    ST.lsAvailableChips = q.bank;
  }
  const isAnswered =
    q.kind === "typing" ? ST.lsTyped.trim() !== "" :
    q.kind === "wordbank" ? ST.lsChipOrder.length === q.bank.length :
    ST.lsSelected != null;
  const isCorrect = ST.lsChecked && (
    q.kind === "typing" ? normalizeForTyping(ST.lsTyped) === normalizeForTyping(q.correct) :
    q.kind === "wordbank" ? ST.lsChipOrder.map((c) => c.word).join(" ") === q.correct :
    ST.lsSelected === q.correct
  );
  const hearts = Math.max(0, 4 - ST.lsMistakes);
  const promptLangId = q.direction === "ku-base" ? ST.dialect : ST.baseLang;

  if (ST.lsFailed) {
    return `<div style="max-width:640px;margin:60px auto;text-align:center;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;padding:0 24px">
      <div style="font-size:48px">💔</div>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:24px;font-weight:700;color:${COLORS.ink};margin:10px 0">${S.outOfMistakes}</div>
      <p style="color:${COLORS.inkSoft};margin-bottom:24px">${S.outOfMistakesDesc}</p>
      <button onclick="App.retryLesson()" style="${primaryBtnStyle(COLORS.gold)}">${S.retry}</button>
      <button onclick="App.exitLesson()" style="${ghostBtnStyle()}margin-top:10px">${S.backHome}</button>
    </div>`;
  }

  const promptBlock = q.listening
    ? `<div style="display:flex;align-items:center;gap:14px;margin-bottom:26px">
        <button onclick="App.speakPrompt()" title="${S.replay}"
          style="background:${accent};border:none;border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 ${shade(accent, -30)}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#fff" /><path d="M16.5 8.5a5 5 0 010 7" stroke="#fff" stroke-width="2" stroke-linecap="round" /><path d="M19 6a9 9 0 010 12" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.75" /></svg>
        </button>
        <div>
          ${ST.lsChecked
            ? `<div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;color:${COLORS.ink}">${S.wordWas} <span style="direction:${promptLangId === "ckb" ? "rtl" : "ltr"};unicode-bidi:embed">${esc(q.prompt)}</span></div>`
            : `<div style="color:${COLORS.inkSoft};font-size:14.5px">${S.tapToListen}</div>`}
        </div>
      </div>`
    : `<div style="display:flex;align-items:center;gap:10px;margin-bottom:26px">
        <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:30px;font-weight:700;color:${COLORS.ink};direction:${promptLangId === "ckb" ? "rtl" : "ltr"}">${esc(q.prompt)}</div>
        <button onclick="App.speakPrompt()" title="${S.speak}"
          style="background:${COLORS.card};border:1px solid ${COLORS.sandDeep};border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="${COLORS.inkSoft}" /><path d="M16.5 8.5a5 5 0 010 7" stroke="${COLORS.inkSoft}" stroke-width="1.8" stroke-linecap="round" /><path d="M19 6a9 9 0 010 12" stroke="${COLORS.inkSoft}" stroke-width="1.8" stroke-linecap="round" opacity="0.6" /></svg>
        </button>
      </div>`;

  let answerAreaHtml = "";
  if (q.kind === "typing") {
    const inputBorder = ST.lsChecked ? (isCorrect ? COLORS.success : COLORS.fail) : COLORS.sandDeep;
    const inputBg = ST.lsChecked ? (isCorrect ? COLORS.successSoft : COLORS.failSoft) : COLORS.card;

    // Kelimenin TÜM harfleri — karıştırılmış + çeldirici ekstra harfler
    const EXTRA_KU  = ["a","b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","v","w","x","y","z","ê","î","û","ş","ç","ñ","ḥ","ẑ"];
    const EXTRA_ZZA = ["a","b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","r","s","t","u","v","w","x","y","z","ê","î","û","ş","ç","ı","ñ"];
    const EXTRA_CKB = ["ا","ب","پ","ت","ج","چ","ح","خ","د","ر","ز","ژ","س","ش","ع","غ","ف","ق","ک","گ","ل","م","ن","و","ه","ی","ە","ێ","ۆ","ڵ","ڕ"];
    const buildLetterBank = (word, dialect) => {
      const normalized = word.toLowerCase().replace(/[!.,?؟،]/g,"");
      // Kelimedeki tüm benzersiz karakterler
      const letters = [...new Set(normalized.split("").filter(ch => ch !== " "))];
      // 3-5 çeldirici ekstra harf
      const extras = dialect === "ckb" ? EXTRA_CKB : dialect === "zza" ? EXTRA_ZZA : EXTRA_KU;
      const distractors = shuffle(extras.filter(ch => !letters.includes(ch))).slice(0, Math.max(3, Math.min(5, Math.ceil(letters.length * 0.6))));
      return shuffle([...letters, ...distractors]);
    };

    const showBank = q.direction === "base-ku" || q.direction === "ku-base";
    const bankLetters = showBank ? buildLetterBank(q.correct, ST.dialect) : [];
    const typed = ST.lsTyped || "";

    const letterBtns = bankLetters.length > 0
      ? `<div>
          <div style="font-size:11px;color:${COLORS.inkSoft};font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">${ST.baseLang === "en" ? "Letters" : "Harfler"}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${bankLetters.map((ch) => {
              const used = typed.toLowerCase().split("").filter(c => c === ch).length;
              const inWord = q.correct.toLowerCase().split("").filter(c => c === ch).length;
              const disabled = ST.lsChecked;
              return `<button type="button" ${disabled ? "disabled" : `onclick="App.typeChar('${ch}')"`}
                style="min-width:38px;height:42px;padding:0 10px;border-radius:10px;border:1.5px solid ${!disabled && used > 0 ? COLORS.gold : COLORS.sandDeep};background:${!disabled && used > 0 ? COLORS.accentSoft : COLORS.card};color:${COLORS.ink};font-size:17px;font-weight:600;cursor:${disabled ? "default" : "pointer"};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;transition:all .12s ease">${ch}</button>`;
            }).join("")}
          </div>
        </div>`
      : "";

    answerAreaHtml = `<div style="display:flex;flex-direction:column;gap:12px">
      <div style="position:relative">
        <input type="text" id="typingInput" value="${esc(typed)}" ${ST.lsChecked ? "disabled" : ""}
          oninput="App.setTyped(this.value)" onkeydown="if(event.key==='Enter'){App.checkAnswer();}"
          placeholder="${S.typingPlaceholder}" autocapitalize="off" autocorrect="off" spellcheck="false"
          style="width:100%;padding:14px 52px 14px 16px;border-radius:14px;border:2px solid ${inputBorder};background:${inputBg};font-size:18px;color:${COLORS.ink};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;outline:none;box-sizing:border-box" />
        ${typed && !ST.lsChecked ? `<button onclick="App.backspaceTyped()" type="button"
          style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:${COLORS.inkSoft};font-size:18px;line-height:1">⌫</button>` : ""}
      </div>
      ${letterBtns}
    </div>`;
  } else if (q.kind === "wordbank") {
    const chipBtn = (chip, placed) => `<button ${ST.lsChecked ? "disabled" : `onclick="App.${placed ? "removeChip" : "addChip"}('${chip.uid}')"`}
      style="padding:8px 14px;border-radius:10px;border:2px solid ${placed ? accent : COLORS.sandDeep};background:${COLORS.card};color:${COLORS.ink};font-size:15px;font-weight:600;cursor:${ST.lsChecked ? "default" : "pointer"};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">${esc(chip.word)}</button>`;
    answerAreaHtml = `<div dir="${ST.dialect === "ckb" ? "rtl" : "ltr"}">
      <div style="min-height:54px;border:2px dashed ${COLORS.sandDeep};border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center">
        ${ST.lsChipOrder.length === 0 ? `<span style="color:${COLORS.inkSoft};font-size:13px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">${S.wordBankHint}</span>` : ""}
        ${ST.lsChipOrder.map((c) => chipBtn(c, true)).join("")}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${ST.lsAvailableChips.map((c) => chipBtn(c, false)).join("")}
      </div>
    </div>`;
  } else {
    answerAreaHtml = `<div style="display:grid;gap:12px">${q.options.map((opt, idx) => {
      const isSel = ST.lsSelected === opt;
      const optLangId = q.direction === "ku-base" ? ST.baseLang : ST.dialect;
      const isRTL = optLangId === "ckb";
      let border = "#E4DAC2", bg = COLORS.card;
      if (ST.lsChecked && opt === q.correct) { border = COLORS.success; bg = COLORS.successSoft; }
      else if (ST.lsChecked && isSel && opt !== q.correct) { border = COLORS.fail; bg = COLORS.failSoft; }
      else if (isSel) { border = COLORS.success; bg = COLORS.card; }
      return `<button ${ST.lsChecked ? "disabled" : `onclick="App.selectOption(${idx})"`}
        style="text-align:${isRTL ? "right" : "left"};direction:${isRTL ? "rtl" : "ltr"};padding:14px 16px;border-radius:14px;border:2px solid ${border};background:${bg};cursor:${ST.lsChecked ? "default" : "pointer"};font-size:16px;color:${COLORS.ink};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:500;transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;box-shadow:${ST.lsChecked ? "none" : "0 1px 3px rgba(0,0,0,0.06)"}">
        ${esc(opt)}
      </button>`;
    }).join("")}</div>`;
  }

  const kindBadge = q.kind === "typing"
    ? `<span style="font-size:10.5px;font-weight:700;color:${accent};background:${accent}22;border-radius:999px;padding:2px 8px">✎ ${S.typingExerciseLabel}</span>`
    : q.kind === "wordbank"
    ? `<span style="font-size:10.5px;font-weight:700;color:${accent};background:${accent}22;border-radius:999px;padding:2px 8px">🧩 ${S.wordBankExerciseLabel}</span>`
    : "";

  const diffTier = (q.kind === "typing" || q.kind === "wordbank") ? "hard" : q.listening ? "medium" : "easy";
  const diffColor = diffTier === "hard" ? COLORS.fail : diffTier === "medium" ? COLORS.goldDeep : COLORS.success;
  const diffLabel = diffTier === "hard" ? S.diffHard : diffTier === "medium" ? S.diffMedium : S.diffEasy;
  const diffBadge = `<span style="font-size:10.5px;font-weight:700;color:${diffColor};background:${diffColor}1a;border-radius:999px;padding:2px 8px">● ${diffLabel}</span>`;

  const footerBg = COLORS.sand;
  const sealHtml = ST.lsChecked
    ? (isCorrect
        ? `<svg width="40" height="40" viewBox="0 0 40 40" style="flex-shrink:0;animation:sealStamp .45s cubic-bezier(.34,1.56,.64,1)">
            <rect x="7" y="7" width="26" height="26" rx="6" fill="${COLORS.gold}" transform="rotate(45 20 20)" />
            <path d="M12 20l6 6 11-12" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>`
        : `<svg width="40" height="40" viewBox="0 0 40 40" style="flex-shrink:0;animation:sealStampShake .5s ease">
            <rect x="7" y="7" width="26" height="26" rx="6" fill="${COLORS.fail}" transform="rotate(45 20 20)" />
            <path d="M14 14l12 12M26 14l-12 12" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
          </svg>`)
    : "";
  const xpPopupHtml = (ST.lsChecked && isCorrect)
    ? `<div style="margin-left:auto;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:15px;color:${COLORS.gold};animation:xpFloat 0.9s ease-out forwards">+10 XP</div>`
    : "";
  const feedback = `<div style="min-height:44px;margin-bottom:${ST.lsChecked ? "14px" : "0"};transition:margin .15s ease;display:flex;align-items:center;gap:12px">
        ${sealHtml}
        <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:16.5px;color:${isCorrect ? COLORS.goldDeep : COLORS.ink}">
          ${ST.lsChecked ? (isCorrect ? S.correct : `${S.correctAnswerIs} <span style="color:${COLORS.fail}">${esc(q.correct)}</span>`) : ""}
        </div>
        ${xpPopupHtml}
      </div>`;

  const celebrationOverlay = ST.celebrating
    ? `<div style="position:absolute;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;animation:celebrateFade 2s ease forwards">
        <div style="position:absolute;inset:0;background:radial-gradient(circle, rgba(227,160,8,0.22), transparent 70%)"></div>
        ${svgDancingEagle(230)}
        <div style="margin-top:8px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:24px;color:${COLORS.goldDeep};text-shadow:0 2px 8px rgba(255,255,255,0.85);animation:celebrateTextPop .5s ease .15s both">
          Hele hele! 🎉
        </div>
      </div>`
    : "";

  return `<div style="max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;position:relative">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 18px 8px">
      <button onclick="App.exitLesson()" title="${S.exit}" style="background:none;border:none;cursor:pointer;padding:4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="${COLORS.inkSoft}" stroke-width="2.4" stroke-linecap="round" /></svg>
      </button>
      <div style="flex:1;height:12px;background:${COLORS.sandDeep};border-radius:8px;overflow:hidden">
        <div style="width:${((ST.lsQIdx + (ST.lsChecked ? 1 : 0)) / ST.lsQuestions.length) * 100}%;height:100%;background:${accent};border-radius:8px;transition:width .3s ease"></div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;color:${COLORS.fail};font-weight:700;min-width:40px">♥ ${hearts}</div>
    </div>

    <div style="flex:1;padding:22px 24px 100px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        <div style="color:${COLORS.inkSoft};font-size:13px;text-transform:uppercase;letter-spacing:.5px">
          ${q.listening ? S.listenAndChoose : (q.direction === "ku-base" ? S.fromKurdish(baseLabel) : S.toKurdish(dialectLabel))}
        </div>
        ${diffBadge}
        ${kindBadge}
      </div>
      ${promptBlock}
      ${answerAreaHtml}
    </div>

    <div style="position:sticky;bottom:0;background:${footerBg};border-top:1px solid ${COLORS.sandDeep};padding:16px 20px 22px">
      ${feedback}
      <button id="checkContinueBtn" onclick="${ST.lsChecked ? "App.continueLesson()" : "App.checkAnswer()"}" ${(!ST.lsChecked && !isAnswered) ? "disabled" : ""}
        style="${primaryBtnStyle(ST.lsChecked ? (isCorrect ? COLORS.success : COLORS.fail) : COLORS.gold, !ST.lsChecked && !isAnswered)}">
        ${ST.lsChecked ? S.continue : S.check}
      </button>
    </div>
    ${celebrationOverlay}
  </div>`;
}

function renderReview() {
  const S = STRINGS[ST.baseLang];
  const accent = COLORS.goldDeep;
  const questions = ST.reviewQuestions;

  if (questions.length === 0) {
    return `<div style="max-width:600px;margin:60px auto;text-align:center;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;padding:0 24px">
      <div style="font-size:48px">🎉</div>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;color:${COLORS.ink};margin:10px 0">
        ${ST.baseLang === "en" ? "No weak words to review!" : "Tekrar edilecek zayıf kelime yok!"}
      </div>
      <button onclick="App.exitReview()" style="${primaryBtnStyle(COLORS.gold)}">${S.backHome}</button>
    </div>`;
  }

  const q = questions[ST.reviewQIdx];
  const isCorrect = ST.reviewChecked && ST.reviewSelected === q.correct;

  const optionsHtml = q.options.map((opt, idx) => {
    const isSel = ST.reviewSelected === opt;
    let border = "#E4DAC2", bg = COLORS.card;
    if (ST.reviewChecked && opt === q.correct) { border = COLORS.success; bg = COLORS.successSoft; }
    else if (ST.reviewChecked && isSel && opt !== q.correct) { border = COLORS.fail; bg = COLORS.failSoft; }
    else if (isSel) { border = COLORS.success; bg = COLORS.card; }
    return `<button ${ST.reviewChecked ? "disabled" : `onclick="App.selectReviewOption(${idx})"`}
      style="text-align:left;padding:14px 16px;border-radius:14px;border:2px solid ${border};background:${bg};cursor:${ST.reviewChecked ? "default" : "pointer"};font-size:16px;color:${COLORS.ink};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:500">
      ${esc(opt)}
    </button>`;
  }).join("");

  const footerBg = COLORS.sand;
  const reviewSealHtml = ST.reviewChecked
    ? (isCorrect
        ? `<svg width="36" height="36" viewBox="0 0 40 40" style="flex-shrink:0;animation:sealStamp .45s cubic-bezier(.34,1.56,.64,1)">
            <rect x="7" y="7" width="26" height="26" rx="6" fill="${COLORS.gold}" transform="rotate(45 20 20)" />
            <path d="M12 20l6 6 11-12" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </svg>`
        : `<svg width="36" height="36" viewBox="0 0 40 40" style="flex-shrink:0;animation:sealStampShake .5s ease">
            <rect x="7" y="7" width="26" height="26" rx="6" fill="${COLORS.fail}" transform="rotate(45 20 20)" />
            <path d="M14 14l12 12M26 14l-12 12" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
          </svg>`)
    : "";
  const feedback = `<div style="min-height:40px;margin-bottom:${ST.reviewChecked ? "14px" : "0"};transition:margin .15s ease;display:flex;align-items:center;gap:12px">
        ${reviewSealHtml}
        <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:16px;color:${isCorrect ? COLORS.goldDeep : COLORS.ink}">
          ${ST.reviewChecked ? (isCorrect ? S.correct : `${S.correctAnswerIs} <span style="color:${COLORS.fail}">${esc(q.correct)}</span>`) : ""}
        </div>
      </div>`;

  return `<div style="max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 18px 8px">
      <button onclick="App.exitReview()" style="background:none;border:none;cursor:pointer;padding:4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="${COLORS.inkSoft}" stroke-width="2.4" stroke-linecap="round" /></svg>
      </button>
      <div style="flex:1;height:12px;background:${COLORS.sandDeep};border-radius:8px;overflow:hidden">
        <div style="width:${((ST.reviewQIdx + (ST.reviewChecked ? 1 : 0)) / questions.length) * 100}%;height:100%;background:${accent};border-radius:8px"></div>
      </div>
      <div style="font-size:20px">🔁</div>
    </div>
    <div style="flex:1;padding:22px 24px 100px">
      <div style="color:${COLORS.inkSoft};font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">
        ${ST.baseLang === "en" ? "Review — what does this mean?" : "Tekrar — bu ne demek?"}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:26px">
        <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:30px;font-weight:700;color:${COLORS.ink};direction:${ST.dialect === "ckb" ? "rtl" : "ltr"}">${esc(q.prompt)}</div>
        <button onclick="App.speakReviewPrompt()" style="background:${COLORS.card};border:1px solid ${COLORS.sandDeep};border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="${COLORS.inkSoft}" /><path d="M16.5 8.5a5 5 0 010 7" stroke="${COLORS.inkSoft}" stroke-width="1.8" stroke-linecap="round" /></svg>
        </button>
      </div>
      <div style="display:grid;gap:12px">${optionsHtml}</div>
    </div>
    <div style="position:sticky;bottom:0;background:${footerBg};border-top:1px solid ${COLORS.sandDeep};padding:16px 20px 22px">
      ${feedback}
      <button onclick="${ST.reviewChecked ? "App.continueReview()" : "App.checkReviewAnswer()"}" ${(!ST.reviewChecked && ST.reviewSelected == null) ? "disabled" : ""}
        style="${primaryBtnStyle(ST.reviewChecked ? (isCorrect ? COLORS.success : COLORS.fail) : COLORS.gold, !ST.reviewChecked && ST.reviewSelected == null)}">
        ${ST.reviewChecked ? S.continue : S.check}
      </button>
    </div>

}

function getSearchResults() {
  const q = (ST.searchQuery || "").trim().toLowerCase();
  const base = q
    ? SEARCH_INDEX.filter((w) =>
        w.tr.toLowerCase().includes(q) || w.en.toLowerCase().includes(q) ||
        w.kmr.toLowerCase().includes(q) || w.ckb.toLowerCase().includes(q) || w.zza.toLowerCase().includes(q)
      )
    : SEARCH_INDEX.slice();
  return base.sort((a, b) => a[ST.dialect].localeCompare(b[ST.dialect])).slice(0, q ? 60 : 300);
}

function renderSearch() {
  const S = STRINGS[ST.baseLang];
  const query = ST.searchQuery || "";
  const q = query.trim().toLowerCase();
  const isRTL = ST.dialect === "ckb";
  const NEON = "#4DD87A";
  const results = getSearchResults();
  const resultsHtml = results.map((w, i) => {
    const kuWord = w[ST.dialect];
    const favKey = `${ST.dialect}::${kuWord}`;
    const isFav = !!ST.favoriteWords[favKey];
    return `<div class="dictCard" style="background:${COLORS.card};border:1px solid ${COLORS.sandDeep};border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="min-width:0">
        <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:17px;color:${COLORS.ink};direction:${isRTL ? "rtl" : "ltr"}">${esc(kuWord)}</div>
        <div style="font-size:13px;color:${COLORS.inkSoft}">${esc(ST.baseLang === "en" ? w.en : w.tr)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button onclick="App.speakSearchResult(${i})" style="background:none;border:1px solid ${COLORS.sandDeep};border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="${NEON}" /></svg>
        </button>
        <button onclick="App.toggleFavoriteSearch(${i})" style="background:none;border:none;cursor:pointer;font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;filter:${isFav ? `drop-shadow(0 0 4px ${COLORS.gold})` : "none"}">
          ${isFav ? "⭐" : "☆"}
        </button>
      </div>
    </div>`;
  }).join("");
  return `<div style="max-width:760px;margin:0 auto;min-height:100vh;padding:24px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">
    <style>
      .dictCard { transition: box-shadow .15s ease, border-color .15s ease; }
      .dictCard:hover { border-color: ${NEON} !important; box-shadow: 0 0 12px rgba(0,229,199,0.28); }
      #searchInput:focus { border-color: ${NEON} !important; box-shadow: 0 0 0 3px rgba(0,229,199,0.22); }
    </style>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <button onclick="App.exitSubScreen()" style="background:none;border:none;cursor:pointer;padding:4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="${COLORS.inkSoft}" stroke-width="2.4" stroke-linecap="round" /></svg>
      </button>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;color:${COLORS.ink};text-shadow:0 0 12px rgba(0,229,199,0.35);letter-spacing:0.3px">${S.searchTitle}</div>
    </div>
    <div style="font-size:12px;color:${COLORS.goldDeep};margin-bottom:16px;margin-left:38px;font-weight:600;letter-spacing:0.5px">
      ${DIALECTS.find((d) => d.id === ST.dialect).label.toUpperCase()} · ${SEARCH_INDEX.length} ${ST.baseLang === "en" ? "entries" : "kayıt"}
    </div>
    <input id="searchInput" value="${esc(query)}" oninput="App.setSearchQuery(this.value)" placeholder="${S.searchPlaceholder}"
      style="width:100%;padding:14px 16px;border-radius:12px;border:1px solid ${COLORS.sandDeep};font-size:16px;color:${COLORS.ink};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;outline:none;margin-bottom:16px;box-sizing:border-box;background:${COLORS.card};transition:box-shadow .15s ease,border-color .15s ease" />
    ${q ? `<div style="font-size:13px;color:${COLORS.inkSoft};margin-bottom:10px">${S.searchResultsCount(results.length)}</div>` : ""}
    ${q && results.length === 0 ? `<div style="text-align:center;padding:40px 20px;color:${COLORS.inkSoft}">${S.searchNoResults}</div>` : ""}
    <div style="display:grid;gap:8px">${resultsHtml}</div>
  </div>`;
}

/* ---------------------------------------------------------
   İSTATİSTİKLER
--------------------------------------------------------- */
function statCardHtml(label, value, accent) {
  return `<div style="background:${COLORS.card};border:1px solid ${COLORS.sandDeep};border-radius:16px;padding:16px 14px;text-align:center">
    <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:26px;color:${accent || COLORS.goldDeep}">${value}</div>
    <div style="font-size:12px;color:${COLORS.inkSoft};margin-top:4px">${label}</div>
  </div>`;
}

function renderStats() {
  const S = STRINGS[ST.baseLang];
  const accuracy = ST.totalAttempted > 0 ? Math.round((ST.totalCorrect / ST.totalAttempted) * 100) : 0;
  const wordsMastered = Object.values(ST.wordMastery).filter((v) => v >= MASTERY_THRESHOLD).length;

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const label = d.toLocaleDateString(ST.baseLang === "en" ? "en-US" : "tr-TR", { weekday: "short" });
    days.push({ key, label, xp: ST.dailyHistory[key] || 0 });
  }
  const maxXp = Math.max(1, ...days.map((d) => d.xp));
  const hasAnyData = days.some((d) => d.xp > 0);

  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = (firstOfMonth.getDay() + 6) % 7;
  const monthCells = [];
  for (let i = 0; i < startWeekday; i++) monthCells.push(null);
  let monthXpTotal = 0, activeDayCount = 0;
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const dayXp = ST.dailyHistory[key] || 0;
    if (dayXp > 0) { monthXpTotal += dayXp; activeDayCount++; }
    monthCells.push({ day, xp: dayXp, isToday: day === now.getDate() });
  }
  const weekdayLabels = ST.baseLang === "en" ? ["M", "T", "W", "T", "F", "S", "S"] : ["P", "S", "Ç", "P", "C", "C", "P"];
  const monthName = now.toLocaleDateString(ST.baseLang === "en" ? "en-US" : "tr-TR", { month: "long", year: "numeric" });
  const monthCalHtml = monthCells.map((cell, i) => `
    <div style="aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
      background:${cell === null ? "transparent" : cell.xp > 0 ? COLORS.gold : COLORS.sand};
      color:${cell === null ? "transparent" : cell.xp > 0 ? "#fff" : COLORS.inkSoft};
      border:${cell && cell.isToday ? `2px solid ${COLORS.goldDeep}` : cell ? `1px solid ${COLORS.sandDeep}` : "none"}">
      ${cell ? cell.day : ""}
    </div>`).join("");

  const statCards = [
    statCardHtml(S.statsTotalXp, ST.xp),
    statCardHtml(S.statsAccuracy, `%${accuracy}`, COLORS.success),
    statCardHtml(S.statsLessonsDone, ST.lessonsCompleted),
    statCardHtml(S.statsWordsMastered, wordsMastered),
    statCardHtml(S.statsBestStreak, ST.longestStreak, COLORS.fail),
  ].join("");

  const chartHtml = !hasAnyData
    ? `<div style="text-align:center;padding:30px 20px;color:${COLORS.inkSoft};background:${COLORS.card};border-radius:16px;border:1px solid ${COLORS.sandDeep};margin-bottom:24px">${S.statsNoData}</div>`
    : `<div style="display:flex;align-items:flex-end;gap:10px;height:140px;background:${COLORS.card};border:1px solid ${COLORS.sandDeep};border-radius:16px;padding:16px 14px;margin-bottom:24px">
        ${days.map((d) => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
            <div style="font-size:10.5px;color:${COLORS.inkSoft};font-weight:700">${d.xp > 0 ? d.xp : ""}</div>
            <div style="width:100%;max-width:28px;height:${Math.max(4, (d.xp / maxXp) * 90)}px;background:${d.xp > 0 ? COLORS.gold : COLORS.sandDeep};border-radius:6px"></div>
            <div style="font-size:10.5px;color:${COLORS.inkSoft};text-transform:capitalize">${d.label}</div>
          </div>`).join("")}
      </div>`;

  return `<div style="max-width:760px;margin:0 auto;min-height:100vh;padding:24px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
      <button onclick="App.exitSubScreen()" style="background:none;border:none;cursor:pointer;padding:4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="${COLORS.inkSoft}" stroke-width="2.4" stroke-linecap="round" /></svg>
      </button>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;color:${COLORS.ink}">${S.statsTitle}</div>
    </div>
    <div style="background:linear-gradient(135deg, ${COLORS.goldDeep}, #8C5E1F);border-radius:18px;padding:18px 20px;margin-bottom:20px;color:#fff">
      <div style="font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${monthName}</div>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:22px">${S.statsMonthSummary(monthXpTotal, activeDayCount)}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:12px;margin-bottom:24px">${statCards}</div>
    <div style="font-weight:700;color:${COLORS.ink};font-size:14px;margin-bottom:12px">${S.statsLast7Days}</div>
    ${chartHtml}
    <div style="font-weight:700;color:${COLORS.ink};font-size:14px;margin-bottom:12px">${S.statsStreakCalendar}</div>
    <div style="background:${COLORS.card};border:1px solid ${COLORS.sandDeep};border-radius:16px;padding:16px 14px">
      <div style="display:grid;grid-template-columns:repeat(7, 1fr);gap:4px;margin-bottom:6px">

const MATCH_PAIRS = 5;
function renderMatch() {
  const S = STRINGS[ST.baseLang];
  const isRTL = ST.dialect === "ckb";

  if (ST.mtDone) {
    return `<div style="max-width:520px;margin:0 auto;min-height:100vh;padding:24px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column">

        <svg width="64" height="64" viewBox="0 0 46 52"><rect width="46" height="52" fill="${COLORS.card}" /><path d="M23,7 L37,26 L23,45 L9,26 Z" fill="none" stroke="${COLORS.goldDeep}" stroke-width="2.2" /><path d="M23,15 L31,26 L23,37 L15,26 Z" fill="${COLORS.gold}" /></svg>
        <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:700;font-size:22px;color:${COLORS.ink}">${S.matchDone}</div>
        <div style="font-size:14px;color:${COLORS.inkSoft}">${S.matchMoves(ST.mtMoves)}</div>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button onclick="App.startMatch()" style="padding:12px 26px;border-radius:999px;border:2px solid ${COLORS.gold};background:none;color:${COLORS.goldDeep};font-weight:700;font-size:15px;cursor:pointer;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">${S.matchAgain}</button>
          <button onclick="App.exitSubScreen()" style="padding:12px 26px;border-radius:999px;border:none;background:${COLORS.gold};color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">${S.quickRoundExit}</button>
        </div>
      </div>
    </div>`;
  }

  const tiles = ST.mtTiles.map(function(t, i) {
    const matched = t.state === "matched";
    const sel = ST.mtSelected === i;
    const wrong = t.state === "wrong";
    let bg = COLORS.card, border = COLORS.sandDeep, color = COLORS.ink;
    if (matched) { bg = COLORS.successSoft; border = COLORS.success; color = COLORS.success; }
    else if (wrong) { bg = COLORS.failSoft; border = COLORS.fail; }
    else if (sel) { bg = COLORS.accentSoft; border = COLORS.gold; }
    const rtl = (t.side === "ku" && isRTL);
    return `<button ${matched ? "disabled" : `onclick="App.pickMatchTile(${i})"`}
      style="position:relative;min-height:62px;padding:10px 12px;border-radius:14px;border:2px solid ${border};background:${bg};color:${color};font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-weight:${t.side === "ku" ? 700 : 600};font-size:${t.text.length > 14 ? 12.5 : 14.5}px;cursor:${matched ? "default" : "pointer"};direction:${rtl ? "rtl" : "ltr"};transition:background .15s ease,border-color .15s ease;word-break:break-word">
      ${esc(t.text)}
      ${matched ? `<svg width="14" height="14" viewBox="0 0 46 52" style="position:absolute;top:5px;right:5px"><path d="M23,15 L31,26 L23,37 L15,26 Z" fill="${COLORS.success}" /></svg>` : ""}
    </button>`;
  }).join("");

  return `<div style="max-width:520px;margin:0 auto;min-height:100vh;padding:24px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <button onclick="App.exitSubScreen()" style="background:none;border:none;cursor:pointer;padding:4px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="${COLORS.inkSoft}" stroke-width="2.4" stroke-linecap="round" /></svg>
      </button>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;color:${COLORS.ink}">${S.matchTitle}</div>
      <div style="margin-left:auto;font-size:13px;font-weight:700;color:${COLORS.goldDeep}">${ST.mtMatched}/${MATCH_PAIRS}</div>
    </div>
    <div style="color:${COLORS.inkSoft};font-size:13.5px;margin-bottom:18px;margin-left:38px">${S.matchSubtitle}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${tiles}</div>
  </div>`;
}

function pickBlankWord(text) {
  const words = text.replace(/[!.,?؟،]/g, "").split(" ").filter(Boolean);
  let longest = words[0] || "";
  words.forEach((w) => { if (w.length > longest.length) longest = w; });
  return longest;
}

function getDialogueBlanks(dialogueId, dialect) {
  const d = DIALOGUES.find((x) => x.id === dialogueId);
  const allWords = d.lines.map((l) => pickBlankWord(l[dialect])).filter(Boolean);
  return d.lines.map((line) => {
    const blank = pickBlankWord(line[dialect]);
    const distractors = shuffle(allWords.filter((w) => w !== blank)).slice(0, 2);
    return { blank, options: shuffle([blank, ...distractors]) };
  });
}

function renderDialogues() {
  const S = STRINGS[ST.baseLang];
  const isRTL = ST.dialect === "ckb";
  const openId = ST.dialoguesOpenId || DIALOGUES[0].id;
  const practiceMode = !!ST.dialoguesPractice;
  const answers = ST.dialoguesAnswers || {};
  const tabs = DIALOGUES.map((d) => `
    <button onclick="App.setDialogueTab('${d.id}')" style="padding:8px 16px;border-radius:999px;border:1.5px solid ${openId === d.id ? COLORS.gold : COLORS.sandDeep};background:${openId === d.id ? COLORS.accentSoft : COLORS.card};color:${COLORS.ink};font-weight:700;font-size:13px;cursor:pointer;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">
      ${esc(d.title[ST.baseLang])}
    </button>`).join("");
  const active = DIALOGUES.find((d) => d.id === openId);
  const blanksData = getDialogueBlanks(openId, ST.dialect);
  const lines = active.lines.map((line, i) => {
    const kuText = line[ST.dialect];
    const isA = line.who === "A";
    const { blank, options } = blanksData[i];
    const picked = answers[i];
    const displayText = practiceMode && !picked ? kuText.replace(blank, "▁▁▁▁▁") : kuText;
    const optsHtml = practiceMode ? `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      ${options.map((opt) => {
        let bg = COLORS.sand, border = COLORS.sandDeep;

        return `<button ${picked ? "disabled" : `onclick="App.answerDialogueBlank(${i},'${opt.replace(/'/g, "\\'")}')"`}

      }).join("")}
    </div>` : "";
    return `<div style="display:flex;justify-content:${isA ? "flex-start" : "flex-end"}">
      <div style="max-width:82%;background:${isA ? COLORS.card : COLORS.accentSoft};border:1.5px solid ${isA ? COLORS.sandDeep : COLORS.gold};border-radius:16px;padding:10px 14px">

          <button onclick="App.speakDialogueLine(${i})" style="background:none;border:none;cursor:pointer;padding:2px;flex-shrink:0">

          </button>
        </div>

        ${optsHtml}

    </div>`;
  }).join("");
  return `<div style="max-width:760px;margin:0 auto;min-height:100vh;padding:24px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">

      </button>
      <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:22px;font-weight:700;color:${COLORS.ink}">${S.dialoguesTitle}</div>

      ${practiceMode ? S.dialoguesPracticeOn : S.dialoguesPracticeOff}

}

    let sparkles = "";
    SPARKLE_SPOTS.forEach((s) => {
      sparkles += `<span style="position:absolute;left:${s.left};bottom:${s.bottom};font-size:${s.size}px;color:${COLORS.gold};opacity:0;animation:sparklePop .9s ease-out ${s.delay} forwards">✦</span>`;
    });
    flyingOverlay = `<div style="position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden">
      ${sparkles}
      <div style="position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);animation:eagleAscend 1.6s cubic-bezier(.3,.1,.3,1) forwards">${svgFlyingEagle(220)}</div>
      <div style="position:absolute;inset:0;background:${COLORS.sand};opacity:0;animation:screenClose 1.5s ease-in forwards"></div>
    </div>`;
  }

  return `<div style="max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;position:relative;overflow:hidden">
    ${confetti}
    <div style="animation:popIn .5s cubic-bezier(.34,1.56,.64,1)">${svgEagleMascot(110, "proud")}</div>
    <div style="display:flex;gap:6px;margin:14px 0 18px">${starsHtml}</div>
    <div style="font-family:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;font-size:26px;font-weight:700;color:${COLORS.ink}">${S.lessonDone}</div>
    <div style="display:flex;gap:28px;margin:22px 0">
      <div style="text-align:center">
        <div style="font-size:22px;font-weight:700;color:${accent}">${result.correctCount}/${result.total}</div>
        <div style="font-size:12px;color:${COLORS.inkSoft}">${S.correctCountLabel}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:22px;font-weight:700;color:${COLORS.goldDeep}">+${result.correctCount * 10}</div>
        <div style="font-size:12px;color:${COLORS.inkSoft}">${S.xp}</div>
      </div>
    </div>
    <button onclick="App.finishResults()" ${ST.resFlying ? "disabled" : ""} style="${primaryBtnStyle(COLORS.gold)}${ST.resFlying ? "opacity:.6" : ""}">${S.continue}</button>
    ${flyingOverlay}
  </div>`;
}

function voiceListHtml() {
  const S = STRINGS[ST.stNextBase];

  if (ST.stVoiceList.length === 0) {
    items += `<div style="font-size:12.5px;color:${COLORS.inkSoft};padding:6px 4px">${S.voiceNone}</div>`;
  }
  ST.stVoiceList.forEach((v, i) => {
    items += `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:2px solid ${ST.stNextVoiceURI === v.voiceURI ? COLORS.gold : "transparent"};background:${ST.stNextVoiceURI === v.voiceURI ? COLORS.accentSoft : COLORS.card}">

/* ---------------------------------------------------------
   ACTIONS
--------------------------------------------------------- */
const App = {
  // onboarding
  obChooseBase(id) { ST.obBaseLang = id; ST.obStep = "dialect"; render(); },
  obChooseDialect(id) { ST.obDialect = id; ST.obStep = "level"; render(); },
  obChooseLevel(id) {
    const level = LEVEL_ASSESSMENT[ST.obBaseLang].find((l) => l.id === id);
    ST.baseLang = ST.obBaseLang;
    ST.dialect = ST.obDialect;
    const done = new Set();
    if (level.startTier === "intermediate") {
      UNITS.filter((u) => u.tier === "beginner").forEach((u) => {
        u.lessons.forEach((_, li) => done.add(`${u.id}-${li}`));
      });
    } else if (level.skipUnits) {
      const beginnerUnits = UNITS.filter((u) => u.tier === "beginner");
      beginnerUnits.slice(0, level.skipUnits).forEach((u) => {
        u.lessons.forEach((_, li) => done.add(`${u.id}-${li}`));
      });
    }
    ST.progress = done;
    ST.screen = "home";
    render();
  },
  obBack() {
    if (ST.obStep === "dialect") ST.obStep = "baseLang";
    else if (ST.obStep === "level") ST.obStep = "dialect";
    render();
  },

  // navigation
  openSettings() {
    ST.stNextBase = ST.baseLang;
    ST.stNextDialect = ST.dialect;
    ST.stNextName = ST.profileName;
    ST.stNextColor = ST.profileColor;
    ST.stNextVoiceURI = ST.voiceURI || "";
    ST.stNextRate = ST.speechRate;
    ST.stNextPitch = ST.speechPitch;
    ST.stNextRaw = !!ST.rawKurdish;
    ST.stNextEngine = ST.kurdishEngine || "tr";
    ST.stNextDark = !!ST.darkMode;
    ST.stNextUsername = ST.username || "";
    ST.stNextAvatarType = ST.avatarType || "initial";

  handlePhotoSelect(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 160;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        ST.stNextAvatarPhoto = canvas.toDataURL("image/jpeg", 0.75);
        ST.stNextAvatarType = "photo";
        render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  },

  addChip(uid) {
    if (ST.lsChecked) return;
    const chip = ST.lsAvailableChips.find((c) => c.uid === uid);

  checkAnswer() {
    const q = ST.lsQuestions[ST.lsQIdx];
    const isAnswered =
      q.kind === "typing" ? ST.lsTyped.trim() !== "" :
      q.kind === "wordbank" ? ST.lsChipOrder.length === q.bank.length :
      ST.lsSelected != null;
    if (!isAnswered) return;
    ST.lsChecked = true;
    const correctNow =
      q.kind === "typing" ? normalizeForTyping(ST.lsTyped) === normalizeForTyping(q.correct) :
      q.kind === "wordbank" ? ST.lsChipOrder.map((c) => c.word).join(" ") === q.correct :
      ST.lsSelected === q.correct;
    ST.totalAttempted += 1;
    if (correctNow) {
      ST.totalCorrect += 1;
      ST.lsCorrectCount += 1;
      playChime("correct");
      if (q.masteryKey) ST.wordMastery[q.masteryKey] = Math.min((ST.wordMastery[q.masteryKey] || 0) + 1, 5);
      srsSchedule(`${ST.dialect}::${q.masteryKey}`, { ku: q.masteryKey, base: q.direction === "ku-base" ? q.correct : q.prompt, dialect: ST.dialect, baseLang: ST.baseLang }, true);
      if (q.kind === "typing" || q.kind === "wordbank") {
        ST.celebrating = true;
        playHalayMusic();
        setTimeout(() => playZilgit(), 900);
        setTimeout(() => { ST.celebrating = false; render(); }, 2000);
      }
    } else {
      ST.lsMistakes += 1;
      playChime("wrong");
      if (q.masteryKey) ST.wordMastery[q.masteryKey] = 0;
      srsSchedule(`${ST.dialect}::${q.masteryKey}`, { ku: q.masteryKey, base: q.direction === "ku-base" ? q.correct : q.prompt, dialect: ST.dialect, baseLang: ST.baseLang }, false);
      const ku = q.direction === "ku-base" ? q.prompt : q.correct;
      const base = q.direction === "ku-base" ? q.correct : q.prompt;
      ST.lsMissedWords = ST.lsMissedWords || [];
      ST.lsMissedWords.push({ ku, base, dialect: ST.dialect, baseLang: ST.baseLang });
      if (ST.lsMistakes > 3) {
        ST.lsFailed = true;
        // Ders başarısız olsa bile o kelimeler kaybolmasın — hemen kaydet
        mergeMissedWordsIntoPool(ST.lsMissedWords);
      }
    }
    render();
  },
  continueLesson() {
    if (ST.lsQIdx + 1 >= ST.lsQuestions.length) {
      const result = { correctCount: ST.lsCorrectCount, total: ST.lsQuestions.length, mistakesCount: ST.lsMistakes };
      const key = `${UNITS[ST.active.unitIdx].id}-${ST.active.lessonIdx}`;
      ST.progress.add(key);
      ST.practiceCount[key] = (ST.practiceCount[key] || 0) + 1;
      const earnedXp = result.correctCount * 10 + (result.mistakesCount === 0 ? 15 : 0);
      ST.xp += earnedXp;
      const today = todayStr();
      ST.dailyHistory[today] = (ST.dailyHistory[today] || 0) + earnedXp;
      if (ST.dailyGoalDate !== today) {
        ST.dailyGoalDate = today;
        ST.dailyXpEarned = earnedXp;
      } else {
        ST.dailyXpEarned += earnedXp;
      }
      const s = updateStreakOnPractice(ST.lastPracticeDate, ST.streak, ST.streakFreezes);
      ST.streak = s.streak;
      ST.longestStreak = Math.max(ST.longestStreak, s.streak);
      ST.lastPracticeDate = s.lastPracticeDate;
      ST.streakFreezes = s.streakFreezes;
      ST.lessonsCompleted += 1;
      if (result.mistakesCount === 0) ST.perfectCount += 1;
      const wk = getWeekKey();
      if (ST.weekChallengeKey !== wk) {
        ST.weekChallengeKey = wk;
        ST.weekChallengeCount = 1;
        ST.weekChallengeClaimed = false;
      } else if (!ST.weekChallengeClaimed) {
        ST.weekChallengeCount += 1;
        if (ST.weekChallengeCount >= WEEK_CHALLENGE_TARGET) {
          ST.weekChallengeClaimed = true;
          ST.xp += 30;
        }
      }
      mergeMissedWordsIntoPool(ST.lsMissedWords);
      ST.lastResult = result;
      ST.resFlying = false;
      ST.screen = "results";
      render();
    } else {
      ST.lsQIdx += 1;
      ST.lsListeningPlayed = false;
      ST.celebrating = false;
      ST.lsSelected = null;
      ST.lsChecked = false;
      ST.lsTyped = "";
      ST.lsChipOrder = [];
      ST.lsAvailableChips = [];
      render();
    }
  },

  openMatch() { App.startMatch(); },
  startMatch() {
    const rows = [];
    UNITS.forEach(function(u){ u.lessons.forEach(function(l){ l.words.forEach(function(w){ rows.push(w); }); }); });
    const picked = shuffle(rows).slice(0, MATCH_PAIRS);
    const tiles = [];
    picked.forEach(function(w, pi){
      tiles.push({ pairId: pi, side: "ku", text: w[ST.dialect], state: "idle" });
      tiles.push({ pairId: pi, side: "base", text: w[ST.baseLang], state: "idle" });
    });
    ST.mtTiles = shuffle(tiles);
    ST.mtSelected = null;
    ST.mtMatched = 0;
    ST.mtMoves = 0;
    ST.mtDone = false;
    ST.screen = "match";
    render();
  },
  pickMatchTile(i) {
    const tiles = ST.mtTiles;
    const t = tiles[i];
    if (!t || t.state === "matched") return;
    if (ST.mtSelected === null) {
      ST.mtSelected = i;
      speak(t.side === "ku" ? t.text : "", ST.dialect, ST.voiceURI, ST.speechRate, ST.speechPitch, ST.rawKurdish, ST.kurdishEngine);
      render();
      return;
    }
    if (ST.mtSelected === i) { ST.mtSelected = null; render(); return; }
    const prev = tiles[ST.mtSelected];
    ST.mtMoves += 1;
    if (prev.pairId === t.pairId && prev.side !== t.side) {
      prev.state = "matched"; t.state = "matched";
      ST.mtSelected = null;
      ST.mtMatched += 1;
      playChime("correct");
      if (ST.mtMatched >= MATCH_PAIRS) {
        ST.mtDone = true;
        ST.xp += 15;
      }
      render();
    } else {
      const a = ST.mtSelected, b = i;
      tiles[a].state = "wrong"; tiles[b].state = "wrong";
      ST.mtSelected = null;
      playChime("wrong");
      render();
      setTimeout(function(){
        if (ST.mtTiles[a]) ST.mtTiles[a].state = "idle";
        if (ST.mtTiles[b]) ST.mtTiles[b].state = "idle";
        if (ST.screen === "match") render();
      }, 600);
    }
  },

  qrNextQuestion() {
    const pairs = App.qrAllPairs();
    const pools = getPools(ST.dialect, ST.baseLang);
    // Hızlı Tur yalnızca şıklı soru gösterir — yazma/kelime bankası
    // soruları burada anlamsız ve ekranı bozuyordu.
    let q = null;
    for (let attempt = 0; attempt < 12; attempt++) {
      const [ku, base] = pairs[Math.floor(Math.random() * pairs.length)];
      const dir = Math.random() < 0.5 ? "ku-base" : "base-ku";
      const candidate = makeQuestion(ku, base, dir, pools, 0, ST.dialect);
      if (candidate && candidate.kind === "choice" && Array.isArray(candidate.options)) {
        q = candidate;
        break;
      }
    }
    ST.qrQuestion = q;
    ST.qrFeedback = null;
  },

    ST.qrPhase = "playing";
    App.qrNextQuestion();

      if (ST.qrSecondsLeft <= 0) {

    const q = ST.reviewQuestions[ST.reviewQIdx];
